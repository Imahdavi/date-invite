<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>یه دعوت خاص 🕷️</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;700&display=swap" rel="stylesheet">
    <style>
        *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            background: #080000;
            min-height: 100vh;
            font-family: 'Vazirmatn', 'Segoe UI', sans-serif;
            overflow-x: hidden;
            color: #fff;
        }

        /* ── Canvas bg ── */
        #bgCanvas {
            position: fixed;
            inset: 0;
            width: 100%; height: 100%;
            z-index: 0;
            pointer-events: none;
        }

        /* ── Hanging spider ── */
        #spiderWrap {
            position: fixed;
            top: 0; left: 50%;
            transform: translateX(-50%);
            z-index: 10;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        #silk {
            width: 1.5px;
            height: 90px;
            background: linear-gradient(to bottom, transparent, rgba(255,255,255,0.35));
            transform-origin: top;
            transform: scaleY(0);
            animation: silkDrop 1.2s ease-out 0.3s forwards;
        }
        @keyframes silkDrop { to { transform: scaleY(1); } }

        .spider-emoji {
            font-size: 36px;
            transform-origin: top center;
            animation: sway 4s ease-in-out infinite;
            filter: drop-shadow(0 0 10px rgba(200,0,0,0.8));
            opacity: 0;
            animation: silkFade 0.4s ease 1.4s forwards, sway 4s ease-in-out 1.8s infinite;
        }
        @keyframes silkFade { to { opacity: 1; } }
        @keyframes sway {
            0%, 100% { transform: rotate(-9deg); }
            50%       { transform: rotate(9deg);  }
        }

        /* ── Page layout ── */
        .page {
            position: relative;
            z-index: 1;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 110px 20px 50px;
        }

        /* ── Card ── */
        .card {
            position: relative;
            background: rgba(12, 0, 0, 0.9);
            border: 1.5px solid rgba(170, 0, 0, 0.55);
            border-radius: 26px;
            padding: 42px 38px;
            max-width: 490px;
            width: 100%;
            box-shadow:
                0 0 0 1px rgba(255,255,255,0.03) inset,
                0 0 50px rgba(160,0,0,0.25),
                0 0 100px rgba(160,0,0,0.08);
            backdrop-filter: blur(14px);
            animation: cardIn 0.7s cubic-bezier(0.34,1.56,0.64,1) 0.6s both;
        }

        .kitten-pic {
            position: absolute;
            top: 30px;
            left: calc(50% + 42px);
            width: 44px;
            height: 44px;
            object-fit: cover;
            border-radius: 6px;
            border: 1.5px solid rgba(255,90,90,0.6);
            box-shadow: 0 0 12px rgba(200,0,0,0.45);
            transform: rotate(-8deg);
            z-index: 2;
        }
        @keyframes cardIn {
            from { opacity:0; transform: translateY(28px) scale(0.94); }
            to   { opacity:1; transform: translateY(0)    scale(1);    }
        }

        /* ── Header ── */
        .logo {
            display: block;
            text-align: center;
            font-size: 68px;
            margin-bottom: 4px;
            animation: logoPulse 3s ease-in-out infinite;
        }
        @keyframes logoPulse {
            0%,100% { filter: drop-shadow(0 0 6px rgba(200,0,0,0.4)); }
            50%     { filter: drop-shadow(0 0 22px rgba(200,0,0,1));  }
        }

        h1 {
            text-align: center;
            font-size: 1.75rem;
            color: #ff2020;
            margin-bottom: 8px;
            text-shadow: 0 0 24px rgba(255,30,30,0.45);
        }

        .tagline {
            text-align: center;
            color: rgba(255,255,255,0.5);
            font-size: 0.88rem;
            line-height: 2.1;
            margin-bottom: 28px;
        }

        .divider {
            height: 1px;
            background: linear-gradient(to right, transparent, rgba(170,0,0,0.5), transparent);
            margin: 0 -6px 28px;
        }

        /* ── Form ── */
        .field { margin-bottom: 22px; }

        label {
            display: block;
            font-size: 0.82rem;
            font-weight: 700;
            color: #ff5555;
            margin-bottom: 9px;
            letter-spacing: 0.02em;
        }

        input[type=text] {
            width: 100%;
            padding: 13px 16px;
            background: rgba(255,255,255,0.04);
            border: 1px solid rgba(160,0,0,0.35);
            border-radius: 13px;
            color: #fff;
            font-size: 0.95rem;
            font-family: 'Vazirmatn', sans-serif;
            transition: border-color 0.2s, box-shadow 0.2s;
            direction: rtl;
        }
        input[type=text]:focus {
            outline: none;
            border-color: rgba(210,0,0,0.7);
            box-shadow: 0 0 14px rgba(200,0,0,0.2);
        }
        input[type=text]::placeholder { color: rgba(255,255,255,0.2); }

        /* ── Yes/No ── */
        .choices {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 13px;
        }

        .choice-btn {
            padding: 15px 10px;
            border-radius: 15px;
            border: 1.5px solid;
            cursor: pointer;
            font-family: 'Vazirmatn', sans-serif;
            font-size: 1rem;
            font-weight: 600;
            transition: all 0.25s cubic-bezier(0.34,1.56,0.64,1);
            background: transparent;
        }

        .choice-btn.yes {
            border-color: #990000;
            color: #ff4444;
        }
        .choice-btn.yes:hover {
            border-color: #ff2222;
            background: rgba(160,0,0,0.25);
            color: #fff;
            transform: scale(1.05) translateY(-2px);
            box-shadow: 0 6px 22px rgba(200,0,0,0.45);
        }
        .choice-btn.yes.active {
            border-color: #ff2222;
            background: rgba(170,0,0,0.4);
            color: #fff;
            transform: scale(1.03);
            box-shadow: 0 6px 22px rgba(200,0,0,0.5);
        }

        .choice-btn.no {
            border-color: rgba(255,255,255,0.12);
            color: rgba(255,255,255,0.28);
        }
        .choice-btn.no:hover {
            border-color: rgba(255,255,255,0.15);
            color: rgba(255,255,255,0.3);
        }

        /* ── Buttons ── */
        .submit-btn {
            width: 100%;
            padding: 15px;
            background: linear-gradient(135deg, #b00000 0%, #6e0000 100%);
            color: #fff;
            border: none;
            border-radius: 14px;
            font-size: 1rem;
            font-weight: 700;
            cursor: pointer;
            font-family: 'Vazirmatn', sans-serif;
            letter-spacing: 0.03em;
            transition: all 0.25s;
            margin-bottom: 12px;
        }
        .submit-btn:hover {
            background: linear-gradient(135deg, #cc0000 0%, #880000 100%);
            transform: translateY(-2px);
            box-shadow: 0 8px 28px rgba(180,0,0,0.55);
        }
        .submit-btn:active { transform: translateY(0); }

        /* ── Success ── */
        #successView { display: none; text-align: center; }
        #successView.show { display: block; animation: cardIn 0.5s cubic-bezier(0.34,1.56,0.64,1); }

        .s-icon {
            display: block;
            font-size: 80px;
            margin-bottom: 18px;
            animation: iconBounce 0.6s cubic-bezier(0.34,1.56,0.64,1);
        }
        @keyframes iconBounce {
            from { transform: scale(0) rotate(-15deg); }
            to   { transform: scale(1) rotate(0deg);   }
        }

        #successTitle { font-size: 1.5rem; color: #ff2020; margin-bottom: 12px; }
        #successMsg   { color: rgba(255,255,255,0.55); line-height: 2.2; font-size: 0.95rem; }

        /* ── Web silk particle ── */
        .silk-particle {
            position: fixed;
            width: 1px;
            background: rgba(255,255,255,0.3);
            top: 0;
            z-index: 0;
            pointer-events: none;
            animation: fallDown linear forwards;
        }
        @keyframes fallDown {
            from { transform: scaleY(0); opacity: 0.6; }
            to   { transform: scaleY(1); opacity: 0;   }
        }
    </style>
</head>
<body>

<canvas id="bgCanvas"></canvas>

<!-- Hanging spider -->
<div id="spiderWrap">
    <div id="silk"></div>
    <span class="spider-emoji">🕷️</span>
</div>

<div class="page">
    <div class="card">

        <!-- ── Form view ── -->
        <div id="formView">
            <span class="logo">🕸️</span>
            <img class="kitten-pic" src="kitten.png" alt="">
            <p class="tagline">
                یه عنکبوت کوچولو داره تارهاشو می‌بافه تا ازت بپرسه...<br>
                🌹 می‌تونم به یه دیت همراه با گالری دعوتت کنم؟
            </p>
            <div class="divider"></div>

            <form id="inviteForm" novalidate>

                <div class="field">
                    <label>🕷️ جوابت چیه؟</label>
                    <div class="choices">
                        <button type="button" class="choice-btn yes" id="yesBtn" onclick="pick('yes')">
                            ❤️ آره، حتماً!
                        </button>
                        <button type="button" class="choice-btn no"  id="noBtn"  onclick="pick('no')">
                            😕 نه، ممنون
                        </button>
                    </div>
                </div>

                <div class="field">
                    <label>💬 حرفی داری بزنی؟ (اختیاری)</label>
                    <input type="text" id="msgInput" name="message"
                           placeholder="اگه چیزی هست بنویس...">
                </div>

                <button type="submit" class="submit-btn">ارسال جواب 🕸️</button>

            </form>
        </div>

        <!-- ── Success view ── -->
        <div id="successView">
            <span class="s-icon" id="sIcon">🎉</span>
            <h1 id="successTitle">ممنون!</h1>
            <p id="successMsg">جوابت رو دریافت کردم!<br>منتظر باش... 🕷️</p>
        </div>

    </div>
</div>


<script>
// ═══════════════════════════════════════════════
//  SPIDER WEB CANVAS
// ═══════════════════════════════════════════════
const canvas = document.getElementById('bgCanvas');
const ctx    = canvas.getContext('2d');

function resize() {
    canvas.width  = window.innerWidth;
    canvas.height = window.innerHeight;
}
resize();
window.addEventListener('resize', resize);

function drawWeb(cx, cy, maxR, rings, spokes, alpha) {
    ctx.save();
    ctx.strokeStyle = `rgba(200, 40, 40, ${alpha})`;
    ctx.lineWidth   = 0.65;

    const angles = Array.from({length: spokes}, (_, i) => (i / spokes) * Math.PI * 2);

    // Radial threads
    ctx.beginPath();
    for (const a of angles) {
        ctx.moveTo(cx, cy);
        ctx.lineTo(cx + Math.cos(a) * maxR, cy + Math.sin(a) * maxR);
    }
    ctx.stroke();

    // Concentric rings (straight silk segments between spokes)
    for (let r = 1; r <= rings; r++) {
        const rad = (r / rings) * maxR;
        ctx.beginPath();
        for (let i = 0; i <= spokes; i++) {
            const a = angles[i % spokes];
            const x = cx + Math.cos(a) * rad;
            const y = cy + Math.sin(a) * rad;
            i === 0 ? ctx.moveTo(x, y) : ctx.lineTo(x, y);
        }
        ctx.closePath();
        ctx.stroke();
    }
    ctx.restore();
}

// Animated silk drop — a thread falls from random top positions
function spawnSilk() {
    const el = document.createElement('div');
    el.className = 'silk-particle';
    const x   = Math.random() * window.innerWidth;
    const h   = 60 + Math.random() * 180;
    const dur = 1.4 + Math.random() * 1.8;
    el.style.cssText = `left:${x}px; height:${h}px; animation-duration:${dur}s;`;
    document.body.appendChild(el);
    setTimeout(() => el.remove(), dur * 1000);
}
setInterval(spawnSilk, 700);

// ── Click webs ──────────────────────────────────
const clickWebs = [];
const CLICK_WEB_DURATION = 2800;

document.addEventListener('click', function (e) {
    clickWebs.push({
        x:      e.clientX,
        y:      e.clientY,
        born:   performance.now(),
        maxR:   70 + Math.random() * 70,
        rings:  4 + Math.floor(Math.random() * 3),
        spokes: 8 + Math.floor(Math.random() * 5),
    });
});

document.addEventListener('touchstart', function (e) {
    // روی دکمه نه کار نمی‌کنه (اون touchstart خودشو داره)
    if (e.target.id === 'noBtn') return;
    const touch = e.touches[0];
    clickWebs.push({
        x:      touch.clientX,
        y:      touch.clientY,
        born:   performance.now(),
        maxR:   70 + Math.random() * 70,
        rings:  4 + Math.floor(Math.random() * 3),
        spokes: 8 + Math.floor(Math.random() * 5),
    });
}, { passive: true });

let t = 0;
function render() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    t += 0.007;
    const pulse = 0.07 + Math.sin(t) * 0.04;

    const W = canvas.width, H = canvas.height;

    drawWeb(0,   0,   320, 7, 9, pulse * 1.4);
    drawWeb(W,   0,   260, 6, 8, pulse * 1.1);
    drawWeb(0,   H,   240, 6, 8, pulse * 0.9);
    drawWeb(W,   H,   300, 7, 9, pulse * 1.3);
    drawWeb(W/2, H/2, 200, 4, 12, pulse * 0.25);

    // تارهای کلیک
    const now = performance.now();
    for (let i = clickWebs.length - 1; i >= 0; i--) {
        const w   = clickWebs[i];
        const age = now - w.born;
        if (age > CLICK_WEB_DURATION) { clickWebs.splice(i, 1); continue; }

        const growT  = Math.min(age / 350, 1);                            // رشد سریع
        const fadeT  = age > 900 ? (age - 900) / (CLICK_WEB_DURATION - 900) : 0; // محو آروم
        const alpha  = growT * (1 - fadeT) * 0.85;
        const radius = w.maxR * growT;

        // رنگ سفیدتر برای تارهای کلیک
        ctx.save();
        ctx.strokeStyle = `rgba(255, 180, 180, ${alpha})`;
        ctx.lineWidth   = 0.8;
        const angles = Array.from({length: w.spokes}, (_, i) => (i / w.spokes) * Math.PI * 2);
        ctx.beginPath();
        for (const a of angles) {
            ctx.moveTo(w.x, w.y);
            ctx.lineTo(w.x + Math.cos(a) * radius, w.y + Math.sin(a) * radius);
        }
        ctx.stroke();
        for (let r = 1; r <= w.rings; r++) {
            const rad = (r / w.rings) * radius;
            ctx.beginPath();
            for (let j = 0; j <= w.spokes; j++) {
                const a = angles[j % w.spokes];
                const x = w.x + Math.cos(a) * rad;
                const y = w.y + Math.sin(a) * rad;
                j === 0 ? ctx.moveTo(x, y) : ctx.lineTo(x, y);
            }
            ctx.closePath();
            ctx.stroke();
        }
        ctx.restore();
    }

    requestAnimationFrame(render);
}
render();

// ═══════════════════════════════════════════════
//  FORM LOGIC
// ═══════════════════════════════════════════════
let chosen = null;

function pick(val) {
    chosen = val;
    document.getElementById('yesBtn').classList.toggle('active', val === 'yes');
    document.getElementById('noBtn').classList.toggle('active', val === 'no');
}

document.getElementById('inviteForm').addEventListener('submit', async function(e) {
    e.preventDefault();

    const msg = document.getElementById('msgInput').value.trim();

    if (!chosen) {
        shake(document.getElementById('yesBtn'));
        return;
    }

    const payload = {
        answer:   chosen === 'yes' ? '✅ بله - میام!' : '❌ نه - ممنون',
        message:  msg || '—',
        _subject: `🕷️ دیت | جواب: ${chosen === 'yes' ? '❤️ آره' : '💔 نه'}`,
        _captcha: 'false',
    };

    const btn = this.querySelector('.submit-btn');
    btn.disabled    = true;
    btn.textContent = '⏳ در حال ارسال...';

    try {
        await fetch('https://formsubmit.co/ajax/halirezamahdavi@gmail.com', {
            method:  'POST',
            headers: { 'Content-Type': 'application/json', Accept: 'application/json' },
            body:    JSON.stringify(payload),
        });
    } catch (_) { /* show success regardless */ }

    showSuccess(chosen);
});

function showSuccess(answer) {
    if (answer === 'yes') {
        document.getElementById('sIcon').textContent       = '❤️🕷️';
        document.getElementById('successTitle').textContent = 'عالیه!';
        document.getElementById('successMsg').innerHTML     = 'خیلی خوشحال شدم!<br>زود خبر می‌دم 🌹';
    } else {
        document.getElementById('sIcon').textContent       = '🕸️';
        document.getElementById('successTitle').textContent = 'ممنون که گزینه ۲ رو انتخاب کردی';
        document.getElementById('successMsg').innerHTML     = 'احترامت رو دارم!<br>موفق باشی 🙏';
    }
    document.getElementById('formView').style.display = 'none';
    document.getElementById('successView').classList.add('show');
}

// ═══════════════════════════════════════════════
//  NO BUTTON — فرار از موس/لمس
// ═══════════════════════════════════════════════
(function () {
    const noBtn = document.getElementById('noBtn');
    let isFixed = false;
    let ghost   = null;

    function detach() {
        if (isFixed) return;
        const rect = noBtn.getBoundingClientRect();

        // جای خالی نگه‌دار تا layout نپاشه
        ghost = document.createElement('div');
        ghost.style.cssText = `width:${rect.width}px;height:${rect.height}px;visibility:hidden;flex-shrink:0;`;
        noBtn.parentNode.insertBefore(ghost, noBtn);

        // سوییچ به fixed
        Object.assign(noBtn.style, {
            position:   'fixed',
            left:       rect.left + 'px',
            top:        rect.top  + 'px',
            width:      rect.width + 'px',
            margin:     '0',
            zIndex:     '500',
            transition: 'left 0.32s cubic-bezier(0.34,1.56,0.64,1), top 0.32s cubic-bezier(0.34,1.56,0.64,1)',
        });
        isFixed = true;
    }

    function flee(mx, my) {
        detach();
        const W   = window.innerWidth,  H = window.innerHeight;
        const bW  = noBtn.offsetWidth,  bH = noBtn.offsetHeight;
        const pad = 12;
        let x, y, tries = 0;
        do {
            x = pad + Math.random() * (W - bW - pad * 2);
            y = pad + Math.random() * (H - bH - pad * 2);
            tries++;
        } while (tries < 30 && Math.hypot(x + bW/2 - mx, y + bH/2 - my) < 200);
        noBtn.style.left = x + 'px';
        noBtn.style.top  = y + 'px';
    }

    noBtn.addEventListener('mouseenter', function (e) {
        flee(e.clientX, e.clientY);
    });

    noBtn.addEventListener('touchstart', function (e) {
        e.preventDefault();
        const t = e.touches[0];
        flee(t.clientX, t.clientY);
    }, { passive: false });

    // کلیک هم نشه (اگه کسی از طریق keyboard یا سرعت بالا برسه)
    noBtn.addEventListener('click', function (e) {
        e.preventDefault();
        e.stopImmediatePropagation();
    });
})();

// Shake animation for validation
function shake(el) {
    el.style.transition = 'transform 0.05s';
    let i = 0;
    const dir = [6, -6, 5, -5, 3, -3, 0];
    const step = () => {
        el.style.transform = `translateX(${dir[i]}px)`;
        if (++i < dir.length) setTimeout(step, 55);
        else el.style.transform = '';
    };
    step();
}

</script>
</body>
</html>
